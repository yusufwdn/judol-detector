<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Judol Spam Detector</title>
    <style>
      :root {
        color-scheme: light dark;

        --bg: #0f0f0f;
        --text: #e8e8e8;
        --card-bg: #1e1e1e;
        --card-border: #2a2a2a;
        --text-sub: #888;
        --text-hint: #555;
        --info-bg: #1a1a2e;
        --info-border: #1e3a5f;
        --info-text: #90caf9;
        --info-code-bg: #0d1b2a;
        --info-code-text: #80deea;
        --btn-reset-bg: #2a2a2a;
        --btn-reset-text: #ccc;
        --switch-track-bg: #111;
        --switch-btn-color: #777;
        --switch-btn-active-bg: #2a2a2a;
        --switch-btn-active-color: #e8e8e8;
        --footer-border: #1e1e1e;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f5f5f5;
          --text: #1a1a1a;
          --card-bg: #ffffff;
          --card-border: #e0e0e0;
          --text-sub: #666;
          --text-hint: #999;
          --info-bg: #e3f2fd;
          --info-border: #90caf9;
          --info-text: #0d47a1;
          --info-code-bg: #d0e7fb;
          --info-code-text: #0b3c7a;
          --btn-reset-bg: #e0e0e0;
          --btn-reset-text: #333;
          --switch-track-bg: #e8e8e8;
          --switch-btn-color: #888;
          --switch-btn-active-bg: #ffffff;
          --switch-btn-active-color: #1a1a1a;
          --footer-border: #e0e0e0;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", sans-serif;
        width: 280px;
        background: var(--bg);
        color: var(--text);
      }

      .header {
        background: linear-gradient(135deg, #d32f2f, #b71c1c);
        padding: 16px;
        text-align: center;
      }

      .header h1 {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      .header p {
        font-size: 11px;
        opacity: 0.85;
        margin-top: 4px;
      }

      .content {
        padding: 16px;
      }

      .status-card {
        background: var(--card-bg);
        border-radius: 10px;
        padding: 12px 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
        border: 1px solid var(--card-border);
      }

      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .status-dot.online {
        background: #4caf50;
        box-shadow: 0 0 6px #4caf50;
      }
      .status-dot.offline {
        background: #f44336;
        box-shadow: 0 0 6px #f44336;
      }
      .status-dot.loading {
        background: #ff9800;
        animation: pulse 1s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      .status-text {
        font-size: 13px;
      }
      .status-text .label {
        font-weight: 600;
      }
      .status-text .sub {
        font-size: 11px;
        color: var(--text-sub);
        margin-top: 2px;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 14px;
      }

      .stat-box {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 10px;
        padding: 12px;
        text-align: center;
      }

      .stat-box .number {
        font-size: 26px;
        font-weight: 700;
        color: #ff5252;
      }

      .stat-box .desc {
        font-size: 10px;
        color: var(--text-sub);
        margin-top: 4px;
        line-height: 1.3;
      }

      .info-box {
        background: var(--info-bg);
        border: 1px solid var(--info-border);
        border-radius: 10px;
        padding: 12px;
        font-size: 11px;
        color: var(--info-text);
        line-height: 1.6;
        margin-bottom: 14px;
      }

      .info-box code {
        background: var(--info-code-bg);
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 10px;
        color: var(--info-code-text);
      }

      .btn {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
      }

      .btn:hover {
        opacity: 0.85;
      }
      .btn:active {
        opacity: 0.7;
      }
      .btn-check {
        background: #1565c0;
        color: white;
      }
      .btn-reset {
        background: var(--btn-reset-bg);
        color: var(--btn-reset-text);
        margin-top: 8px;
      }

      .threshold-box {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 14px;
      }

      .threshold-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }

      .threshold-header .label {
        font-size: 12px;
        color: var(--text-sub);
      }

      .threshold-header .value {
        font-size: 13px;
        font-weight: 700;
        color: #ff9800;
      }

      .threshold-hint {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: var(--text-hint);
        margin-top: 6px;
      }

      input[type="range"] {
        width: 100%;
        accent-color: #ff9800;
        cursor: pointer;
      }

      .mode-box {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 10px;
        padding: 10px 14px;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .mode-box .label {
        font-size: 12px;
        color: var(--text-sub);
      }

      .mode-switch {
        display: flex;
        background: var(--switch-track-bg);
        border-radius: 8px;
        padding: 2px;
        gap: 2px;
      }

      .mode-switch button {
        border: none;
        background: transparent;
        color: var(--switch-btn-color);
        font-size: 11px;
        font-weight: 600;
        padding: 5px 10px;
        border-radius: 6px;
        cursor: pointer;
      }

      .mode-switch button.active {
        background: var(--switch-btn-active-bg);
        color: var(--switch-btn-active-color);
      }

      .footer {
        text-align: center;
        font-size: 10px;
        color: var(--text-hint);
        padding: 10px 16px;
        border-top: 1px solid var(--footer-border);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>🛡 Judol Spam Detector</h1>
      <p>Powered by SVM · Bahasa Indonesia</p>
    </div>

    <div class="content">
      <!-- Status Server -->
      <div class="status-card">
        <div class="status-dot loading" id="statusDot"></div>
        <div class="status-text">
          <div class="label" id="statusLabel">Mengecek server...</div>
          <div class="sub" id="statusSub">localhost:8000</div>
        </div>
      </div>

      <!-- Statistik -->
      <div class="stats-grid">
        <div class="stat-box">
          <div class="number" id="hiddenCount">0</div>
          <div class="desc">Komentar spam disembunyikan</div>
        </div>
        <div class="stat-box">
          <div class="number" id="scannedCount">0</div>
          <div class="desc">Komentar telah dipindai</div>
        </div>
      </div>

      <!-- Cara menyembunyikan komentar spam -->
      <div class="mode-box">
        <span class="label">Komentar spam</span>
        <div class="mode-switch">
          <button type="button" id="hideModeDimBtn" data-mode="dim">
            Redupkan
          </button>
          <button type="button" id="hideModeRemoveBtn" data-mode="remove">
            Hilangkan
          </button>
        </div>
      </div>

      <!-- Threshold Slider -->
      <div class="threshold-box">
        <div class="threshold-header">
          <span class="label">Confidence threshold</span>
          <span class="value" id="thresholdValue">75%</span>
        </div>
        <input
          type="range"
          id="thresholdSlider"
          min="50"
          max="95"
          step="5"
          value="75"
        />
        <div class="threshold-hint">
          <span>50% · Lebih sensitif</span>
          <span>95% · Lebih selektif</span>
        </div>
      </div>

      <!-- Info -->
      <!-- <div class="info-box">
        Pastikan server Python aktif sebelum membuka YouTube/Instagram.<br /><br />
        Jalankan di terminal:<br />
        <code>python src/server.py</code>
      </div> -->

      <!-- Tombol -->
      <button class="btn btn-check" id="btnCheck">🔄 Cek Status Server</button>
      <button class="btn btn-reset" id="btnReset">Reset Statistik</button>
    </div>

    <div class="footer">SVM Linear Kernel · Bahasa Indonesia</div>

    <script src="popup.js"></script>
  </body>
</html>
