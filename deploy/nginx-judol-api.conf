# Reverse proxy Nginx untuk Judol Spam Detector API.
# Certbot akan menyisipkan blok SSL otomatis ke file ini saat dijalankan
# (certbot --nginx), jadi versi ini sengaja hanya port 80 dulu.
#
server {
    listen 80;
    server_name api-svm.cupsky.my.id;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
